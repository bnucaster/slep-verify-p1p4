# EXP-P3（低梯度区审议轨迹近测地；S2P 规划段）确证配置。
# 协议 v1.1 第 5 节 P3（v1.2 判据继承）；系统 S2P（多步解码头）。
train_config: configs/s2p_train_eval.yaml   # 评估族训练配置（时间戳后创建运行）
out_campaign: eval_v1
system_class: S2P
# 场阶段（V̂ 场与梯度分区，独立于轨迹）
n_episodes: 800
episode_len: 64
burn_in: 8
n_ref: 16000
n_field_query: 2048
k_potential: 32
bootstrap: 500
# 审议轨迹阶段（端点条件化 MPC，确定性任务流）
n_nav_tasks: 300
max_steps: 24
bfs_band: [2, 6]
segment_len: 8            # 轨迹段长（转移数）：时长匹配由定长保证
max_pairs_per_group: 20   # 每梯度组测地求解上限（认证下限 8 对）
distance_match_bins: 4    # 端点弦长分位分箱匹配
# 测地求解（成本档：残差质检 ≤3e-3 不达标的对照常剔除，衰减率入报告）
geo_n_segments: 12
geo_n_starts: 3
geo_n_adam: 150
geo_n_lbfgs: 80
torch_threads: 10
