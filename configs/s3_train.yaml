# S3（小 Transformer 序列世界模型）开发族训练（计划 11.3，选项 E）。
# 数据分布与效用口径同 S2；检查点节奏满足协议 EXP-P1 约束（均匀段每
# 500 步）。d_model 32 / 2 层 / 2 头为 plan_v2 "最小版" 的操作化。
campaign: s3_dev_v1
maze_cells: 8
view: 5
obs_dim: 50
action_dim: 4
d_model: 32
n_layers: 2
n_heads: 2
ff_dim: 64
sigma_dec: 0.2
goal_sigma_dec: 0.04
episodes: 500
episode_len: 64
train_steps: 20000
batch_episodes: 32
lr: 1.0e-3
log_every: 500
checkpoint_log2_until: 512
checkpoint_every: 500
holdout_episodes: 64
seed_family: development
torch_threads: 10
sanity_nav:
  n_mazes: 20
  bfs_min: 2
  bfs_max: 6
  max_steps: 24
