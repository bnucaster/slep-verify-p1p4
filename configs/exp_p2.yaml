# EXP-P2（轨迹集中于低作用量路径；S2P）确证配置。
# 协议 v1.1 第 5 节 P2（v1.2 继承）：≥1000 轨迹 × ≥50 度量口径代理，
# 势项消融配对差（判定有效性核心），新奇注入逻辑回归 + 安慰剂。
train_config: configs/s2p_train_eval.yaml
out_campaign: eval_v1
system_class: S2P
# 场（参照对与估计器）
n_episodes: 900           # 平稳 rollout：轨迹池 + 参照集共用采集
episode_len: 64
burn_in: 8
n_ref: 16000
k_potential: 32
# 主判据
n_traj: 1000
traj_len: 50              # 每条推理轨迹状态数（≥50 端点匹配代理的观测段）
n_surrogates: 50
block: 20                 # 缓存块大小（断点续跑粒度）
metric_floor_rel: 0.001   # 代理游走到度量奇异区的正则地板（描述阶段口径）
# 新奇注入（另列一致性检查）
n_novelty_episodes: 200
t_inject: 32
novelty_window: 3         # 注入后计新奇指示的步数
# 漂移分层
n_drift_eval: 1500
k_drift: 256
torch_threads: 10
