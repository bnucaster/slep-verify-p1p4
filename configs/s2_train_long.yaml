# S2 加长开发族训练（任务八点五 8.5a）：找效用平台。
# 与 dev_v2 的差异：20k 步（dev_v2 的 6k 步实测效用未饱和）、均匀检查点
# 加密到每 500 步（供平台检测），其余不变。
campaign: dev_v3
maze_cells: 8
view: 5
obs_dim: 50
action_dim: 4
embed_dim: 32
hidden_dim: 16
sigma_dec: 0.2
goal_sigma_dec: 0.04
episodes: 500
episode_len: 64
train_steps: 20000
batch_episodes: 32
lr: 1.0e-3
log_every: 500
checkpoint_log2_until: 512
checkpoint_every: 500
holdout_episodes: 64
seed_family: development
torch_threads: 10
sanity_nav:
  n_mazes: 20
  bfs_min: 2
  bfs_max: 6
  max_steps: 24
