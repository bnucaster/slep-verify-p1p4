# EXP-P3（低梯度区审议轨迹近测地；S2P 规划段）确证配置。
# 协议 v1.1 第 5 节 P3（v1.2 判据继承）；系统 S2P（多步解码头）。
train_config: configs/s2p_train_eval.yaml
out_campaign: eval_v1
system_class: S2P
# 场阶段（V̂ 场与梯度分区，独立于轨迹）
n_episodes: 800
episode_len: 64
burn_in: 8
n_ref: 16000
n_field_query: 2048
k_potential: 32
bootstrap: 500
# 审议轨迹阶段（端点条件化 MPC，确定性任务流）
n_nav_tasks: 300
max_steps: 24
bfs_band: [2, 6]
segment_len: 8
max_pairs_per_group: 20
distance_match_bins: 4
# 测地求解（float64 解码器副本 + 逐对能量归一；残差质检 ≤3e-3 为冻结
# 判据，估计度量上实测可达 ~0.26——量表差距入档，剔除照判）
geo_n_segments: 12
geo_n_starts: 3
geo_n_adam: 800
geo_n_lbfgs: 300
torch_threads: 10
