# S1 能力阶梯低档（任务六 6c 试点；探索性，plan_v2 第 2 节能力阶梯）。
# 与基准档（configs/s1_train.yaml）唯一差异：通道减半、fc 减半；β 只跑 1
#（试点两档对比用逃逸率更高的 β 档）。
campaign: tier_low_v1
data_file: data/dsprites_ndarray_co1sh3sc6or40x32y32_64x64.npz
packed_cache: data/dsprites_packed.npy
