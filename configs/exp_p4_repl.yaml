# EXP-P4' 复制族（协议 v1.3 增补 A4）：仅用于建立 P2 判定所需的入域门
# （能力/几何/平稳），与评估族 exp_p4_s2p 同源同口径。P4 仿射统计作为副产
# 物计算但不进 A4 判定（增补只预注册 P2；P4×S2P-复制不报）。
# 与 configs/exp_p4_s2p.yaml 唯一差异：训练配置指向复制族、战役名、种子族与
# seeds_file、v1_3 门开关。
train_config: configs/s2p_train_repl.yaml
out_campaign: s2p_repl_v1
seeds_file: configs/seeds_v1_3.yaml
seed_family: replication
require_v1_3_frozen: true
n_chains: 4
episodes_per_chain: 4096
burn_in: 8
chain_stream_offset: 500000
reservoir_per_chain: 14000
rhat_series_n: 600
n_ref: 16000
n_query: 2048
k_potential: 32
k_knn_density: 32
capability: {n_tasks: 160, max_steps: 24, bfs_band: [2, 6], task_stream_offset: 313000}
torch_threads: 10
