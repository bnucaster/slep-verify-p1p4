# CAL-P1 配置（M1 校准，任务四 4a，plan_v2 第 5 节第 4 条）。
# 目的：构造性两相 / 无两相曲线族上定标平台检测器窗长 W 的工作特性。
# θ=1%/窗与连续 3 窗为 plan_v2 冻结值，不在扫描范围。
horizon: 400            # 检查点数
u_max: 0.8
curves:                 # two_phase: 有真平台；no_plateau: 不得检出；borderline: 缓增边界例单列
  exp_fast:   {kind: exp,       tau: 40,  group: two_phase}
  exp_slow:   {kind: exp,       tau: 100, group: two_phase}
  logistic:   {kind: logistic,  center: 120, scale: 25, group: two_phase}
  piecewise:  {kind: piecewise, knee: 150, group: two_phase}
  linear:     {kind: linear,    group: no_plateau}
  powerlaw:   {kind: powerlaw,  exponent: 0.3, group: borderline}
noise_sigmas: [0.005, 0.01, 0.02, 0.04]   # 效用观测噪声标准差；真实 Û 噪声待描述阶段实测（来源缺口注明于产物）
windows: [10, 20, 30, 40]
replicas: 200           # 每（曲线, σ, W）重复数，均分两个校准种子
seed_family: calibration
