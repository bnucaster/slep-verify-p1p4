# 依赖版本未锁定；2026-08-24 实测通过的环境（.venv, Python 3.13.1, Windows 11）：
# torch 2.13.0+cpu / numpy 2.5.2 / scipy 1.18.1 / scikit-learn 1.9.0
# / PyYAML 6.0.3 / matplotlib 3.11.1 / pytest 9.1.1。是否锁定待与用户商定。
[project]
name = "slep-p1p4"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "torch",
  "pyyaml",
  "scikit-learn",
  "matplotlib",
]
# normalizing flow（归一化流）库在实现熵/密度双路估计时选定并登记于此

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
